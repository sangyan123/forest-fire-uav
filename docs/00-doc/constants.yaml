# =====================================================================
# 森林防火无人机智能系统 — 参数唯一数值来源（constants.yaml）
# =====================================================================
# 归属:   00号基线 V1.3 第5章（docs/00-doc/ 机器可执行来源）
# 版本:   constants-v1.5
# 日期:   2026-09-27（v1.1/v1.2/v1.3: 2026-10-05 增补 extinguishing_ball / loudspeaker_broadcast / patrol_schedule 段；v1.4: 2026-10-05 patrol_schedule 增禁期窗口参数；v1.5: 2026-10-06 增补 supply_drop 段，见 change-log）
#
# 定位:
#   本文件只收录 00基线 V1.3 自身章节冻结的数值参数
#   （第33章 F01 / 第34章 F04 / 第35章 去重 / 第36章 电量 / 第56章 Token过渡基线）。
#
# 规则（基线第32~33章、第76章）:
#   1. 每个数值的唯一基线是 00基线对应章节；本文件是其机器可执行注册表；
#   2. 修改任何数值必须走基线第32章变更协议（Experiment ID + Dataset
#      Version + Old/New + Metrics + Reviewer + Change Reason），禁止直接手改；
#   3. 运行时配置文件（config/algorithm/*.yaml 等，第⑨~⑩步建立）以
#      configVersion 镜像本文件数值，不得另创数值；
#   4. 不属于本文件的数值一律见文末 pointers（指标→baseline-metrics.yaml，
#      F07权重→config/algorithm/risk-v1.yaml/ISSUE-001，协议频率→05号，
#      Mock仿真→05号，资源规格→10号）。
# =====================================================================

meta:
  file_version: constants-v1.6
  baseline: "00 跨文档设计基线与矛盾修订清单 V1.3（docs/00-doc/active/00_跨文档设计基线_V1.3.md）"
  created: 2026-09-27
  status: "V1 Engineering Baseline（工程基线，非科学结论）"
  change_protocol: "基线第32章：Experiment ID + Dataset Version + Old/New + Evaluation Metrics + Reviewer + Change Reason"

constants:

  # -------------------------------------------------------------------
  # 1. 电量四级阈值（基线第36章）
  #    镜像目标: config/algorithm/uav-safety-v1.yaml（第⑨步）
  #    枚举对应: enums.yaml#BatteryState
  # -------------------------------------------------------------------
  battery_thresholds:
    baseline_chapter: "V1.3 第36章"
    unit: percent_remaining
    tiers:
      low_battery_warning_pct: 30    # BatteryState.LOW_BATTERY_WARNING 起点；触发 UAV_EVENT.LOW_BATTERY
      no_new_mission_pct: 25         # BatteryState.NO_NEW_MISSION 起点；不再接受新任务
      return_home_pct: 20            # BatteryState.RETURN_HOME 起点；优先返航/结束当前任务
      critical_pct: 10               # BatteryState.CRITICAL 起点；紧急降落；触发 UAV_EVENT.CRITICAL_BATTERY
    ranges:
      NORMAL:              "remaining >= 30%"
      LOW_BATTERY_WARNING: "25% <= remaining < 30%"
      NO_NEW_MISSION:      "20% <= remaining < 25%"
      RETURN_HOME:         "10% <= remaining < 20%"
      CRITICAL:            "remaining < 10%"
    vendor_safety_profile_override: true
    override_note: "真实设备可按机型以 Vendor Safety Profile 覆盖软件基线（09号第25章），覆盖值必须记录并审计；不替代飞控/电池厂商自身失效保护。"
    consumers: ["doc-04", "doc-05", "doc-08", "doc-09", "backend", "uav-gateway", "mock-uav"]

  # -------------------------------------------------------------------
  # 2. F01 火情检测参数（基线第33章）
  #    镜像目标: config/algorithm/fire-detection-v1.yaml（第⑨步）
  # -------------------------------------------------------------------
  fire_detection:
    baseline_chapter: "V1.3 第33章"
    config_version_example: "fire-detection-config-v1.0"
    thresholds:
      t_candidate: 0.40              # confidence < 0.40 忽略；0.40~0.60 为 Candidate
      t_alert: 0.60                  # 0.60~0.80 为 Alert Candidate
      t_confirm: 0.80                # >= 0.80 为 High Confidence（仍须进入F04核验，不可直接确认火情）
    temporal_stability:
      window_frames: 5               # TEMPORAL_WINDOW
      min_positive_frames: 3         # MIN_POSITIVE_FRAMES：5帧窗口内至少3帧一致目标
    notes:
      - "以上为V1工程基线，必须参与验证集实验（基线第31章）。"
      - "最终火情确认必须经F04核验（基线第33章）。"
    consumers: ["doc-03", "doc-06", "doc-08", "ai-service", "backend"]

  # -------------------------------------------------------------------
  # 3. F04 二次核验权重与决策（基线第34章）
  #    镜像目标: config/algorithm/verification-v1.yaml（第⑨步）
  # -------------------------------------------------------------------
  verification:
    baseline_chapter: "V1.3 第34章"
    config_version_example: "verification-config-v1.0"
    weights:
      rgb: 0.35
      thermal: 0.35
      temporal: 0.15
      spatial: 0.15
    formula: "VerificationScore = 0.35×RGB + 0.35×Thermal + 0.15×Temporal + 0.15×Spatial"
    decision:
      confirmed_min: 0.80            # Score >= 0.80 → CONFIRMED
      false_alarm_below: 0.50        # Score < 0.50 → FALSE_ALARM；0.50~<0.80 → UNCERTAIN
    consumers: ["doc-03", "doc-06", "doc-08", "ai-service", "backend"]

  # -------------------------------------------------------------------
  # 4. 火情去重参数（基线第35章）
  # -------------------------------------------------------------------
  fire_dedup:
    baseline_chapter: "V1.3 第35章"
    distance_m: 100                  # DEDUP_DISTANCE：空间距离阈值
    time_s: 120                      # DEDUP_TIME：时间差阈值
    same_category_required: true     # 类别一致才判同一火情候选事件
    false_alarm_suppress_window_s: 1800  # FALSE_ALARM_SUPPRESS：误报终态后同点（≤distance_m）抑制窗口，检测挂原事件留痕不新建（D8彩排实测裂事件缺陷；RESOLVED/CLOSED不抑制）
    note: "V1工程基线，不是森林火灾的通用科学阈值。"
    consumers: ["doc-03", "doc-04", "doc-08", "backend"]

  # -------------------------------------------------------------------
  # 5. Token 有效期（基线第56章）
  #    【已移交】唯一拥有者现为 config/auth/auth-v1.yaml（第⑩步建立）；
  #    以下数值仅为冻结历史记录，00号不再独立维护第二套Token有效期。
  # -------------------------------------------------------------------
  auth_token_lifetime:
    baseline_chapter: "V1.3 第56章"
    status: migrated_to_auth_config   # 唯一拥有者：config/auth/auth-v1.yaml
    access_token_minutes: 30
    refresh_token_days: 7
    consumers: ["doc-07", "backend"]

  # -------------------------------------------------------------------
  # 6. 灭火弹投放参数（2026-10-05 demo 增补，无基线章节）
  #    来源: 用户产品决策（投放灭火弹功能），随 CommandType#DROP_EXTINGUISHING_BALL
  #    配套建立；真实投放器参数须待 Phase 9A 真机适配时按第32章实验协议重定。
  #    镜像目标: mock-uav/app/simulator.py（EXTINGUISHING_BALL_* 常量，注释回链本段）
  # -------------------------------------------------------------------
  extinguishing_ball:
    baseline_chapter: "无（demo 增补，登记 change-log 2026-10-05）"
    capacity: 3                       # 机载灭火弹挂载数量（弹药耗尽后命令 FAILED）
    drop_max_radius_m: 150            # 投放安全半径：无人机与目标点距离超限则命令 FAILED
    consumers: ["doc-03", "doc-05", "doc-09", "mock-uav", "backend", "frontend"]

  # -------------------------------------------------------------------
  # 7. 机载喊话播报参数（2026-10-05 demo 增补，无基线章节）
  #    来源: 用户产品决策（喊话警告功能），随 CommandType#LOUDSPEAKER_BROADCAST
  #    配套建立；真实喊话器/TTS 参数待 Phase 9A 按第32章实验协议重定。
  #    镜像目标: mock-uav/app/simulator.py（LOUDSPEAKER_BROADCAST_* 常量，注释回链本段）
  # -------------------------------------------------------------------
  loudspeaker_broadcast:
    baseline_chapter: "无（demo 增补，登记 change-log 2026-10-05）"
    default_message: "严禁野外用火，保护森林安全。同时警告，任何盗伐、滥伐林木的行为都将受到法律严惩。"   # 缺省播报词（唯一权威来源；前端不持有文本，播报后由设备 result.message 回传展示）
    duration_seconds: 5               # 播报时长（mock 模拟，用于设备回执延迟与前端气泡展示）
    consumers: ["doc-03", "doc-05", "doc-09", "mock-uav", "frontend"]

  # -------------------------------------------------------------------
  # 8. 定时巡逻计划（2026-10-05 demo 增补，无基线章节）
  #    来源: 用户产品决策（"一天几点准时飞起来巡逻然后飞多少个小时"）。
  #    日常计划始终生效：每天 start_time 自动起飞、巡逻 duration_hours 后（08:00+10h=18:00）
  #    自动返航降落；快捷指令开关=手动班次（立即起飞，同样飞到 18:00）。
  #    镜像目标: backend application.yml（patrol.schedule.*，env 可覆盖）；班次内存态。
  # -------------------------------------------------------------------
  patrol_schedule:
    baseline_chapter: "无（demo 增补，登记 change-log 2026-10-05）"
    start_time: "08:00"               # 每日自动起飞时刻（zone 时区）
    duration_hours: 10                # 巡逻时长（窗口结束=18:00 自动返航）
    closure_start_time: "06:00"       # 禁期（封山期）每日自动起飞时刻（v1.4 增补）
    closure_duration_hours: 14        # 禁期巡逻时长（06:00+14h=20:00，封山期人进不去、无人机加密巡）
    zone: "Asia/Shanghai"             # 计划时区（后端容器为 UTC，窗口计算按此时区）
    consumers: ["doc-03", "doc-05", "backend", "frontend"]
    note: "禁期日期范围（startDate~endDate）为运行时状态，经 PUT /api/v1/patrol-schedule/closure 配置（内存态），不进本文件"

  # -------------------------------------------------------------------
  # 9. 机载应急物资投放参数（2026-10-06 demo 增补，无基线章节）
  #    来源: 用户产品决策（快捷指令「投放物资」），随 CommandType#DROP_SUPPLIES
  #    配套建立；真实物资仓参数待 Phase 9A 真机适配时按第32章实验协议重定。
  #    镜像目标: mock-uav/app/simulator.py（SUPPLY_DROP_* 常量，注释回链本段）
  # -------------------------------------------------------------------
  supply_drop:
    baseline_chapter: "无（demo 增补，登记 change-log 2026-10-06）"
    capacity: 3                       # 机载应急物资包挂载数量（耗尽后命令 FAILED）
    item_name: "应急救援物资包（急救包/饮用水/应急口粮）"   # 物资包内容描述（回执 result.item 回传展示）
    consumers: ["doc-03", "doc-05", "doc-09", "mock-uav", "frontend"]

  # -------------------------------------------------------------------
  # 10. F07 风险评估参数（2026-10-09 页面聚合设计增补，无基线章节）
  #    来源: 火情风险检测页面聚合设计（F07+F11+F08，03号新增章节）；
  #    网格自动划分（用户决策 2026-10-09）、气象数据源 mock（用户决策）。
  #    数值属 V1 工程基线，正式投产前按第32章实验协议重定。
  #    镜像目标: backend application.yml（risk.*，env 可覆盖）+ ai-service mock
  # -------------------------------------------------------------------
  risk_assessment:
    baseline_chapter: "无（页面聚合设计增补，登记 change-log 2026-10-09）"
    weights:                          # 五因子权重（和=1.0），对应 03号第15.4节公式
      historical: 0.30                # 历史火点/火灾次数/违规用火
      weather: 0.25                   # 温度/湿度/风（气象 mock 数据源）
      vegetation: 0.20                # 植被类型/郁闭度
      terrain: 0.15                   # 坡度/坡向/地形
      human_activity: 0.10            # 道路/景区/居民区/施工区域
    score_range: "0~100（各因子归一化到 0~100 后加权）"
    level_thresholds:
      high_min: 70                    # risk_score >= 70 → RiskLevel.HIGH
      medium_min: 40                  # 40 <= risk_score < 70 → RiskLevel.MEDIUM；< 40 → LOW
    grid:
      cell_size_m: 1000               # 网格自动划分边长（用户决策：网格自动划分，一期不支持手工圈定）
      origin_lat: 30.12               # 网格原点（演示区左下角，与离线瓦片范围对齐）
      origin_lon: 114.12
      grid_cols: 5                    # 演示范围横向网格数（约 5km）
      grid_rows: 5                    # 纵向网格数（约 5km）
    assess_trigger: "on_demand + 建议周期 30min（一期由页面手动触发 + 后端启动时初始化一次）"
    consumers: ["doc-03", "doc-04", "backend", "ai-service", "frontend", "db"]

  # -------------------------------------------------------------------
  # 11. F11 火势趋势预测参数（2026-10-09 页面聚合设计增补，无基线章节）
  #    来源: 页面聚合设计；一期 Level 1 规则椭圆扩散模型（03号第19.4节）。
  #    硬约束: 气象数据源与 DJI 遥测 wind_speed 分离（03号第19.3节），
  #    本段参数的 wind 输入一律来自气象 mock，不得读机载遥测。
  # -------------------------------------------------------------------
  fire_prediction:
    baseline_chapter: "无（页面聚合设计增补，登记 change-log 2026-10-09）"
    forecast_horizons_min: [30, 60]   # 预测档位（分钟）
    spread_model:
      base_spread_rate_m_per_min: 1.5     # 无风平地火线蔓延速度（工程基线）
      wind_speed_factor_per_mps: 0.20     # 沿风分量每 1 m/s 蔓延速度放大的比例
      uphill_factor: 1.30                 # 上坡方向速度系数
      downhill_factor: 0.80               # 下坡方向速度系数
      length_width_ratio_base: 1.5        # 椭圆长短轴比基准
      length_width_ratio_per_mps: 0.25    # 风速每 1 m/s 长短轴比增量（上限 3.0）
      length_width_ratio_max: 3.0
    confidence_base: 0.78             # Level 1 规则模型置信度基准（03号第19.5节示例 0.78）
    trigger: "auto_on_verification_round + manual_rerun（用户决策：核验轮次自动触发 + 页面可手动重跑）"
    weather_source: "mock（用户决策 2026-10-09；二期留 adapter 接真实气象 API）"
    consumers: ["doc-03", "doc-06", "backend", "ai-service", "frontend", "db"]

  # -------------------------------------------------------------------
  # 12. F08 巡检建议生成参数（2026-10-09 页面聚合设计增补，无基线章节）
  #    来源: 页面聚合设计；一期"区域排序 + 规则生成航点"（03号第16.3节）。
  # -------------------------------------------------------------------
  patrol_suggestion:
    baseline_chapter: "无（页面聚合设计增补，登记 change-log 2026-10-09）"
    lane_spacing_m: 80                # 覆盖航线间距（100m 相对高度约定扫幅下的工程值）
    coverage_altitude_m: 100          # 建议航点相对高度（与巡逻高度一致）
    cruise_speed_mps: 9               # 估时用巡航速度（与 mock-uav CRUISE_SPEED_MPS 一致）
    top_n_suggestions: 5              # 单次生成最多返回的建议数（按 risk_score 降序取前 N）
    poll_intervals_ms:                # 火情风险检测页前端轮询（风险变化慢，低于火情页 1~2s 量级）
      risk_areas: 60000
      predictions: 120000
      suggestions: 30000
    consumers: ["doc-03", "backend", "ai-service", "frontend", "db"]

# ---------------------------------------------------------------------
# pointers：不属于本文件的数值参数去向（防止同一数字多处维护）
# ---------------------------------------------------------------------
pointers:
  algorithm_metrics:
    target: "docs/00-doc/baseline-metrics.yaml（第⑤步建立）"
    version_example: "algorithm-metrics-v1.0"
    scope: "F01~F04正式目标 + F05~F12候选目标（基线第41~52章）"
  f07_risk_weights:
    target: "config/algorithm/risk-v1.yaml（第⑨步）"
    status: "ISSUE-001 OPEN：现AHP六因子合计1.00但缺human_activity，须按基线第32章实验协议确定，严禁发明数值"
  f08_f09_scoring_weights:
    owner: "06号算法专项 A08/A09（如调度打分 0.30·Distance+0.20·Battery+0.20·Capability+0.15·Availability+0.15·Communication）"
    target: "config/algorithm/ 后续按需扩展"
  protocol_rates:
    owner: "05号协议文档（心跳5s/连续3次丢失判离线、UAV_STATE/TELEMETRY 1Hz、HEARTBEAT 0.2Hz、高并发5/10/20Hz）"
  mock_simulator_params:
    owner: "05号协议文档（电池仿真悬停0.6%/min、普巡1.0%、高速1.5%、重载+0.3%等）"
  environment_resources:
    owner: "10号部署与运维文档 V1.2 第82章（DEV/DEMO/TEST/PROD资源基线）"
  demo_scenarios:
    owner: "10号部署与运维文档 V1.2（Scenario-01~06）"
