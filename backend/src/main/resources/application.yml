server:
  port: 8080

spring:
  application:
    name: forest-fire-uav-backend

  datasource:
    # 环境变量优先；本 yml 默认值仅本地兜底（容器环境由 deploy compose 注入）
    url: ${DB_URL:jdbc:postgresql://postgres:5432/forest_fire}
    username: ${DB_USERNAME:forest_fire}
    password: ${DB_PASSWORD:forest_fire}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Schema 由 postgres 容器初始化（db/migration/V1__baseline_schema.sql）执行，禁止应用再建
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # 迁移由 postgres 容器初始化完成，应用侧禁止再跑
    enabled: false

  jackson:
    # 时间统一 ISO-8601 字符串（Instant → "2026-09-27T10:00:00.123Z"）
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    time-zone: UTC

gateway:
  # UAV Gateway 下发地址，容器环境用 GATEWAY_URL 覆盖
  url: ${GATEWAY_URL:http://uav-gateway:9000}

ai-service:
  # AI 算法服务（F01检测/F03定位/F04核验，mock provider），容器环境用 AI_SERVICE_URL 覆盖
  url: ${AI_SERVICE_URL:http://ai-service:8000}

device:
  # 心跳超时离线阈值（秒，D5）：device_status != 'OFFLINE' 的设备，其最新
  # uav_telemetry.event_time 距今超过该值 → 置 'OFFLINE'（DeviceOfflineScheduler 每 5 秒扫描）
  offline-timeout-seconds: 15

mock:
  # mock-uav 模拟器状态查询（定时巡逻收敛循环用），容器环境用 MOCK_URL 覆盖
  url: ${MOCK_URL:http://mock-uav:8002}

patrol:
  schedule:
    # 定时巡逻计划（2026-10-05 demo 增补，默认值机器来源 constants.yaml#patrol_schedule）
    # 每天 start-time 自动起飞、巡逻 duration-hours 小时后自动返航降落（08:00+10h=18:00）；
    # 禁期（封山期）启用后按 closure-* 独立窗口巡逻（默认 06:00+14h=20:00），日期范围经 REST 配置；
    # 时区 zone；班次为内存态，重启后回到本配置并自愈。开关（手动班次）经 /api/v1/patrol-schedule
    device-code: ${PATROL_DEVICE_CODE:UAV-001}
    start-time: ${PATROL_START_TIME:08:00}
    duration-hours: ${PATROL_DURATION_HOURS:10}
    closure-start-time: ${PATROL_CLOSURE_START_TIME:06:00}
    closure-duration-hours: ${PATROL_CLOSURE_DURATION_HOURS:14}
    zone: ${PATROL_ZONE:Asia/Shanghai}

risk:
  # 火情风险检测页参数（2026-10-09 页面聚合设计，默认值机器来源 constants.yaml v1.6
  # risk_assessment / fire_prediction / patrol_suggestion 三段，03号第91章）
  grid:
    # 网格自动划分：原点=演示区左下角，1km×1km，5×5=25 格
    cell-size-m: ${RISK_GRID_CELL_SIZE_M:1000}
    origin-lat: ${RISK_GRID_ORIGIN_LAT:30.12}
    origin-lon: ${RISK_GRID_ORIGIN_LON:114.12}
    grid-cols: ${RISK_GRID_COLS:5}
    grid-rows: ${RISK_GRID_ROWS:5}
  weights:
    # F07 五因子权重（和=1.0）
    historical: ${RISK_W_HISTORICAL:0.30}
    weather: ${RISK_W_WEATHER:0.25}
    vegetation: ${RISK_W_VEGETATION:0.20}
    terrain: ${RISK_W_TERRAIN:0.15}
    human-activity: ${RISK_W_HUMAN_ACTIVITY:0.10}
  level-thresholds:
    high-min: ${RISK_LEVEL_HIGH_MIN:70}
    medium-min: ${RISK_LEVEL_MEDIUM_MIN:40}
  prediction:
    # F11 Level 1 规则椭圆扩散（horizons 以逗号分隔）
    horizons-min: ${RISK_PREDICT_HORIZONS:30,60}
    base-spread-rate-m-per-min: ${RISK_SPREAD_BASE:1.5}
    wind-speed-factor-per-mps: ${RISK_SPREAD_WIND_FACTOR:0.20}
    length-width-ratio-base: ${RISK_LW_BASE:1.5}
    length-width-ratio-per-mps: ${RISK_LW_PER_MPS:0.25}
    length-width-ratio-max: ${RISK_LW_MAX:3.0}
    confidence: ${RISK_PREDICT_CONFIDENCE:0.78}
  patrol:
    # F08 巡检建议（蛇形覆盖航点）
    lane-spacing-m: ${RISK_PATROL_LANE_M:80}
    coverage-altitude-m: ${RISK_PATROL_ALT_M:100}
    cruise-speed-mps: ${RISK_PATROL_SPEED_MPS:9}
    top-n: ${RISK_PATROL_TOP_N:5}

assessment:
  # 灾后情况检测页参数（2026-10-09 页面聚合设计，默认值机器来源 constants.yaml v1.7
  # assessment 段，03号第18章）。三项决策（方案 A）：三分带+幂等覆盖+仅 RESOLVED/CLOSED 可评估
  severity-ratios:
    # 三分带同心收缩比例（SEVERE=火心核最内环，MODERATE 中环，LIGHT 外环）
    severe: ${ASSESS_SEVERITY_SEVERE:0.30}
    moderate: ${ASSESS_SEVERITY_MODERATE:0.45}
    light: ${ASSESS_SEVERITY_LIGHT:0.25}
  shrink-rate-range:
    # 火场外环相对 fire_polygon 保留率区间（按事件种子确定性取值）
    min: ${ASSESS_SHRINK_MIN:0.75}
    max: ${ASSESS_SHRINK_MAX:0.95}
  confidence: ${ASSESS_CONFIDENCE:0.82}
  forest-coverage-range:
    # 过火区域内林地占比区间
    min: ${ASSESS_FOREST_MIN:0.55}
    max: ${ASSESS_FOREST_MAX:0.80}
  road-length-range:
    # 受影响道路长度区间（米）
    min: ${ASSESS_ROAD_MIN:0}
    max: ${ASSESS_ROAD_MAX:2500}
  facility-area-range:
    # 受影响设施面积区间（平方米）
    min: ${ASSESS_FACILITY_MIN:0}
    max: ${ASSESS_FACILITY_MAX:800}

management:
  endpoints:
    web:
      exposure:
        include: health,info
