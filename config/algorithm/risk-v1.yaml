configVersion: risk-config-v1.0
status: PENDING_ISSUE-001    # 权重未冻结：现AHP六因子合计1.00但缺human_activity（见change-log ISSUE-001）

function: F07 森林火险风险评估（一期AHP加权，二期RF/XGBoost/LightGBM+SHAP）

factors:                     # 因子集合（基线模板七因子；id与06号16.8节对齐）
  - id: temperature
    weight: null             # 【待06号V1冻结值——严禁为填满配置而发明数值】
  - id: humidity
    weight: null
  - id: wind_speed
    weight: null
  - id: vegetation
    weight: null
  - id: terrain
    weight: null
